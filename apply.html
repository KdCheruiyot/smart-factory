<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apply for a Job</title>
  <link rel="stylesheet" href="apply.css" />
</head>
<body>

    <!-- Sidebar -->
    <button onclick="toggleSidebar()" class="sidebar-toggle"><i class="fas fa-bars"></i></button>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <i class="fas fa-briefcase"></i> Smart Factory
        </div>
        <ul class="sidebar-menu">
          <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
          <li><a href="jobs.html"><i class="fas fa-list"></i> Job Listings</a></li>
          <li><a href="about.html"><i class="fas fa-info-circle"></i> About</a></li>
          <li><a href="wallet.html"><i class="fas fa-wallet"></i> Wallet</a></li>
          <li><a href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a></li>
        </ul>
      </div>

  <div class="application-container">
    <h1>Apply for a Job</h1>
    <form id="apply-form">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="job">Select Job Role</label>
        <select id="job" name="job" required>
          <option value="">--Choose a Job--</option>
          <option value="data-annotation">Data Annotation</option>
          <option value="data-entry">Data Entry</option>
          <option value="academic-writing">Academic Writing</option>
          <option value="data-transcription">Data Transcription</option>
        </select>
      </div>

      <div class="form-group">
        <label for="resume">Upload Resume</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" />
      </div>

      <div class="form-group">
        <label for="message">Cover Letter</label>
        <textarea id="message" name="message" rows="5" placeholder="Write a short cover letter..."></textarea>
      </div>

      <button type="submit">Submit Application</button>
    </form>

    <div id="response-message"></div>
  </div>

  <script src="apply.js"></script>
</body>
</html>
