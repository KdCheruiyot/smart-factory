<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
    <a href="index.html" class="company-brand">
        <i class="fas fa-briefcase"></i> Smart Factory
      </a>

    <!-- Main Content Section -->
    <main>
        <section class="login-section">
            <h2>Sign In</h2>
            <form id="login-form" method="POST" action="javascript:void(0)">
                <div class="form-group">
                    <label for="username">Username/Email</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" onclick="login()">Sign In</button>
            </form>
            <p class="signup-link">
                Don’t have an account? <a href="signup.html"><strong>Sign Up here</strong></a>
              </p>
              
            
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Online Job Advertisements</p>
    </footer>

    <script src="login.js"></script>
</body>
</html>
